name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a pull request makes the first run's answer irrelevant, so
# stop paying for it. Pushes to main are never cancelled: that history is the
# record of what was actually green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # macOS is where this was developed; ubuntu guards the journald/Linux paths
    # from bit-rotting even though the live Linux path is still unverified.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee /tmp/tests.log

      # So the run page answers "how many tests, on what" without anyone
      # opening the log of one job out of ten.
      - name: Summarise
        if: always()
        shell: bash
        run: |
          line=$(grep -E "^Ran [0-9]+ tests" /tmp/tests.log | tail -1 || true)
          echo "- \`${{ matrix.os }}\` Python ${{ matrix.python-version }}: ${line:-no test output}" \
            >> "$GITHUB_STEP_SUMMARY"

      # llmwatch.py is generated from the llmwatch/ package. An edit that only
      # reached the package works everywhere the maintainers look and nowhere a
      # `curl -O llmwatch.py` user runs it, so the two are compared on every
      # push rather than at release time.
      - name: Check the generated single file is up to date
        run: python tools/bundle.py --check

      # ...and that it is a working program, not just an up-to-date one: the
      # whole suite again, against a tree where `import llmwatch` resolves to
      # the single file instead of the package.
      - name: Run the suite against the generated single file
        run: python tools/check_bundle.py

      - name: Check both entry points start and report the version
        run: |
          python llmwatch.py --version
          python -m llmwatch --version

      - name: Check it fails cleanly with no log present
        run: |
          set +e
          LLMWATCH_LOG=/nonexistent/ollama.log python llmwatch.py --last
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2 for a missing log, got $code"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify the console script is installable
        run: |
          pip install dist/*.whl
          llmwatch --version
