[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# `ollama-llmwatch` everywhere -- PyPI, GitHub, and the command -- because the
# bare name `llmwatch` is taken on PyPI by an unrelated cost-tracking package.
# A short `llmwatch` alias is also installed for convenience (see
# [project.scripts]); it is the one name that could collide if someone has both
# packages installed, which is why it is the alias and not the canonical name.
name = "ollama-llmwatch"
version = "0.8.0"
description = "See what your local Ollama model is actually doing: live prefill progress, ETA, tok/s, and how long a whole agent turn takes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ollama", "llm", "local-llm", "llama.cpp", "monitoring", "tokens-per-second",
            "prefill", "codex", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
# No dependencies, deliberately: this should be safe to curl and run.
dependencies = []

[project.urls]
Homepage = "https://github.com/bingcheng45/ollama-llmwatch"
Issues = "https://github.com/bingcheng45/ollama-llmwatch/issues"

[project.scripts]
ollama-llmwatch = "llmwatch:main"   # canonical, matches the package name
llmwatch = "llmwatch:main"          # short alias

[tool.setuptools]
py-modules = ["llmwatch"]
